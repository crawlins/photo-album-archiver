[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "albumproc"
version = "0.1.0"
description = "Turn several phone photos of a photo-album page into one clean, flat page image"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
albumproc = "albumproc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
