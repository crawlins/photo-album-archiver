[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "albumproc"
version = "0.2.0"
description = "Turn phone photos of photo-album pages into clean, print-ready page images and one PDF per album"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.7",
    "Pillow>=10",
    "img2pdf>=0.5",
    "pikepdf>=8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
albumproc = "albumproc.cli:main"
albumserver = "albumserver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
